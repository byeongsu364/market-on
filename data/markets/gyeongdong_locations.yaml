# 경동시장 점포 핀 위치 — 카카오맵 장소와 수동 대조 (2026-11-27)
# 기준: 상가정보 상호 = 카카오 장소 이름, 그리고 상가정보 도로명 주소 = 카카오 장소 주소(같은 건물)일 때만 씀.
# 이름만 비슷하거나 다른 건물의 같은 이름 가게는 넣지 않음. 여기 없는 점포는 지도에 핀 없이 목록에만 나옴.
# 출처: 카카오 로컬 API '키워드로 장소 검색'(시장 중심 반경 700m), 상가정보(소상공인시장진흥공단) 2026-09.
# 같은 상호·주소 규칙: 카카오 같은 이름 장소가 점포 수만큼 → 따로(핀 하나씩). 업종 같고 카카오 장소 1곳 이하 → 한 점포로
#   합침(duplicates, 숨김). 업종이 다르면 따로 두고 카카오와 맞는 쪽에만 핀. 최종 확인은 상인 가입 때.
