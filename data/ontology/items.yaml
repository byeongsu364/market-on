  - id: item:green_onion
    type: "item"
    name_ko: "대파"
    kamis: {ctgry_cd: "200", item_cd: "246", vrty_cd: "00", grd_cd: "04", unit: kg, unit_sz: "1"}
    attrs: {}
    source: src:team-draft
    labels: {"ko": ["대파", "파"]}
    vision: [green onion, scallion]
    criteria:
      - {key: leaf, text: 잎 끝까지 탄력 있어 보이고 마른 잎이 섞여 있지 않아요, source: 'src:nongsaro-month-food-green-onion', labels: {en: [Healthy leaves]}}
      - {key: stem, text: 줄기의 흰 부분이 많고 깨끗해요, source: 'src:nongsaro-month-food-green-onion'}
      - {key: root, text: 흰 뿌리 쪽을 살짝 만지면 무르지 않고 탄력이 있어요, source: 'src:nongsaro-month-food-green-onion'}
      - {key: bunch, text: 묶음 안의 길이와 굵기가 비슷해요, source: 'src:nongsaro-month-food-green-onion'}
    relations:
      - {p: hasGrade, o: 'variety:green_onion-daepa', props: {default: true}}
      - {p: isA, o: 'cat:vegetable'}
      - {p: soldBy, o: 'unit:bunch', props: {factor_kg: 0.8, default: true}, source: 'src:team-draft'}
      - {p: soldBy, o: 'unit:kg', props: {factor_kg: 1}}
      - {o: 'season:03', p: inSeason, source: 'src:nongsaro-month-food-list'}
      - {p: harvestPeriod, source: 'src:nongsaro-month-food-green-onion', v: {label: 가을~겨울, note: 일반적으로 늦가을이나 초봄에 씨를 뿌려 수확}}
      - {o: 'region:busan-myeongji', p: producedIn, source: 'src:nongsaro-month-food-green-onion'}
      - {o: 'region:jeonnam-coast', p: producedIn, source: 'src:nongsaro-month-food-green-onion'}
      - {o: 'region:chungnam-asan', p: producedIn, source: 'src:nongsaro-month-food-green-onion'}
  - id: item:onion
    type: "item"
    name_ko: "양파"
    kamis: {ctgry_cd: "200", item_cd: "245", vrty_cd: "00", grd_cd: "04", unit: kg, unit_sz: "1"}
    attrs: {}
    labels: {"ko": ["양파"], "en": ["onion"]}
    criteria:
      - {key: firm, text: 손으로 눌러 보면 무르지 않고 단단해요, source: 'src:nongsaro-month-food-onion'}
      - {key: skin, text: 껍질이 잘 말라 있고 윤기가 있어요, source: 'src:nongsaro-month-food-onion'}
      - {key: sprout, text: 싹이 나 있지 않아요, source: 'src:nongsaro-month-food-onion'}
      - {key: weight, text: 들어 보면 크기에 비해 무게감이 있어요, source: 'src:nongsaro-month-food-onion'}
    relations:
      - {p: hasGrade, o: 'variety:onion-onion', props: {default: true}}
      - {p: isA, o: 'cat:vegetable'}
      - {p: soldBy, o: 'unit:kg', props: {factor_kg: 1, default: true}}
      - {o: 'season:06', p: inSeason, source: 'src:nongsaro-month-food-list'}
      - {p: harvestPeriod, source: 'src:nongsaro-month-food-onion', v: {from: '04', label: 4~6월, note: 가을에 씨를 뿌려 이듬해 수확, to: '06'}}
      - {p: harvestPeriod, source: 'src:nongsaro-month-food-onion-2', v: {from: '09', label: 9월 상·중순, note: 고랭지 여름양파, to: '09'}}
  - id: item:apple
    type: "item"
    name_ko: "사과"
    kamis: {"ctgry_cd": "400", "item_cd": "411", "vrty_cd": "05", "grd_cd": "04", "unit": "개", "unit_sz": "10"}
    attrs: {}
    labels: {"ko": ["사과"], "en": ["apple"]}
    criteria:
      - {key: color, text: 껍질 색이 고르고 밝아요, source: 'src:nongsaro-month-food-apple'}
      - {key: stem, text: 꼭지에 푸른색이 돌고 물기가 있어 보여요, source: 'src:nongsaro-month-food-apple'}
      - {key: surface, text: 흠집이나 병·벌레 자국이 없어요, source: 'src:nongsaro-month-food-apple'}
      - {key: tap, text: 가볍게 두드리면 탄력 있고 꽉 찬 느낌이 나요, source: 'src:nongsaro-month-food-apple'}
    relations:
      - {p: hasGrade, o: 'variety:apple-fuji', props: {default: true}}
      - {p: hasGrade, o: 'variety:apple-hongro'}
      - {p: hasGrade, o: 'variety:apple-shinano-gold'}
      - {p: isA, o: 'cat:fruit'}
      - {p: soldBy, o: 'unit:piece', props: {count: 1, default: true}}
      - {o: 'season:09', p: inSeason, source: 'src:nongsaro-month-food-list'}
      - {o: 'season:10', p: inSeason, source: 'src:nongsaro-month-food-list'}
  - id: item:pear
    type: "item"
    name_ko: "배"
