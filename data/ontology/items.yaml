    criteria:
      - {key: color, text: 겉이 맑고 투명한 노란빛이에요, source: 'src:nongsaro-month-food-pear'}
      - {key: skin, text: 껍질이 쭈글쭈글하지 않고 매끄러워요, source: 'src:nongsaro-month-food-pear'}
      - {key: stem, text: 꼭지 부분이 깊숙이 들어가 있어요, source: 'src:nongsaro-month-food-pear'}
      - {key: calyx, text: 꽃받침 부위가 파랗지 않고 노랗게 변해 있어요, source: 'src:nongsaro-month-food-pear'}
    relations:
      - {p: hasGrade, o: 'variety:pear-shingo', props: {default: true}}
      - {p: isA, o: 'cat:fruit'}
      - {p: soldBy, o: 'unit:piece', props: {count: 1, default: true}}
      - {o: 'season:09', p: inSeason, source: 'src:nongsaro-month-food-list'}
      - {o: 'season:10', p: inSeason, source: 'src:nongsaro-month-food-list'}
