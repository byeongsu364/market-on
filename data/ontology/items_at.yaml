    text: '애호박: 표면이 고르고 흠집이 없으며 꼭지가 신선한 상태로 달려 있는 것이 좋음. 잘랐을 때 씨앗이 너무 크거나 누렇게 들뜬 것은 오래된 것이며, 손으로 눌러 보아 탄력이 없는 것은
      바람이 든 것이므로 피해야 함'
    source: src:nics-month-food-squash
  - key: p2
    text: '단호박: 색깔이 고르게 짙고 단단하며 크기에 비해 무거운 것이 좋음'
    source: src:nics-month-food-squash
  - key: p3
    text: '늙은 호박: 크기가 매우 크며 몸체의 윤기가 있고 담황색을 띤 것. 껍질이 단단한 것이 좋음'
    source: src:nics-month-food-squash
