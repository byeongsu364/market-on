  criteria:
  - key: p1
    text: 잎이 두껍고 진한 녹색을 띠고 윤택이 나는 것이 좋다. 뿌리는 붉고 색이 선명하며 길이는 10~15cm인 것을 고른다. 시금치는 사용 용도에 따라 무침용, 국거리용으로 구분할 수 있는데
      무침용은 길이가 짧고 뿌리 부분이 선명한 붉은색을 띠는 것이 좋으며 국거리용은 줄기가 연하고 길며 잎이 넓은 것이 좋다. 잎이 건조하거나 황갈색으로 변한 것은 질소의 함량이 낮아 신선도가 떨어지는
      것이다.
    source: src:nics-month-food-spinach
