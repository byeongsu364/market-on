      factor_kg: 10
      default: true
  - p: inSeason
    o: season:11
    source: src:nics-month-food-rice
  criteria:
  - key: p1
    text: 쌀을 구입할 때, 포장지의 &apos;품질표시사항&apos;에 적혀있는 품종, 등급, 생산년도, 도정날짜 등을 꼼꼼히 살펴보는 것이 중요하다. 쌀을 고를 때에는 금이 가지 않고 투명하며,
      쌀 고유의 향기로운 냄새가 나는 것이 좋다. 잘 여문 쌀은 손으로 한 줌 쥐었을 때 묵직한 느낌이 든다. 쌀알이 통통하고 광택이 있으며, 가루가 묻어나지 않는 것이 신선하고 좋은 쌀이다.
    source: src:nics-month-food-rice
