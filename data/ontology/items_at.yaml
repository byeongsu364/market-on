- id: item:napa_cabbage
  type: item
  name_ko: 배추
  labels:
    ko:
    - 배추
    en:
    - napa cabbage
  kamis: &id011
    ctgry_cd: '200'
    item_cd: '211'
    vrty_cd: '03'
    grd_cd: '04'
    unit: 포기
    unit_sz: '1'
  attrs:
    criteria_style: source_quote
  relations:
  - p: isA
    o: cat:vegetable
  - p: hasGrade
    o: variety:napa_cabbage-03
    props:
      default: true
  - p: soldBy
    o: unit:head
    props:
      count: 1
      default: true
  - p: inSeason
    o: season:11
    source: src:nics-month-food-napa-cabbage
  criteria:
  - key: p1
    text: 먼저 잎의 두께가 얇고 잎맥이 얇아 부드러운 것이 좋은 배추다. 뿌리 부위와 줄기 부위의 둘레가 비슷한 장구형이면서 흰 부분을 눌렀을 때 단단하고 수분이 많으며 싱싱한 것을 고르도록
      한다. 속의 잎은 연백색을 띠면서 뿌리가 완전히 제거된 것, 각 잎이 중심부로 모이면서 잎 끝이 서로 겹치지 않는 것이 좋다. 또 속의 잎을 씹어보았을 때 달고 고소한 맛이 나야 한다. 잘랐을
      때는 속이 꽉 차 있고 내부가 노란색을 띠는 것이 좋은데, 너무 진한 노란색이나 흰색은 피하는 것이 좋다.
    source: src:nics-month-food-napa-cabbage
