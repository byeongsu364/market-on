# 운영 위치: beta (172.26.4.90). 소스와 빌드는 alpha에서, 배포는 alpha에서 `laea svc deploy market-on`.
# 포트는 127.0.0.1과 beta 사설 IP에만 연다 — 외부 요청은 gate만 들어온다.
# marketon.laea.io → gate nginx → beta:4090(web: 화면 + /api → api). DB는 cortie-db 전용 DB(marketon_db / marketon_app).
# LLM·임베딩은 Ollama(gemma4:e4b, bge-m3). 비밀값은 .env.docker(laea-secret 제품 marketon).
name: marketon
services:
  marketon-api:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: cortie/marketon-api:latest
    env_file: ./.env.docker
    # 사진 업로드 — beta 도커 볼륨 marketon_media
    volumes: ["media:/srv/backend/storage"]
    restart: unless-stopped
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  marketon-web:
    build: ./frontend
    image: cortie/marketon-web:latest
    depends_on: [marketon-api]
    ports:
      - "127.0.0.1:4090:4090"
      - "172.26.4.90:4090:4090"
    restart: unless-stopped
    mem_limit: 64m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4090/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  media:
